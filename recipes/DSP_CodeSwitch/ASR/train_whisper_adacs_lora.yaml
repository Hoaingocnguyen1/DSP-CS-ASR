# Whisper Small AdaCS (LoRA Mode)
# ========================================

seed: 2025
__set_seed: !apply:speechbrain.utils.seed_everything [!ref <seed>]

data_folder: ../../../data/vimedcss
output_folder: !ref results/Whisper_LoRA_AdaCS/<seed>
save_folder: !ref <output_folder>/save
train_log: !ref <output_folder>/train_log.txt

train_annotation: !ref <data_folder>/train.json
valid_annotation: !ref <data_folder>/valid.json
test_annotation: !ref <data_folder>/test.json

label_smoothing: 0.1

number_of_epochs: 50
early_stop_patience: 5
batch_size: 8
lr_whisper: 0.0003          
weight_decay: 0.0001
num_workers: 16               
min_decode_ratio: 0.0
max_decode_ratio: 1.0
valid_beam_size: 4
test_beam_size: 8

num_biases: 2700
lora_rank: 16
lora_alpha: 32.0

train_dataloader_opts:
    batch_size: !ref <batch_size>
    num_workers: !ref <num_workers>
    shuffle: True

valid_dataloader_opts:
    batch_size: !ref <batch_size>
    num_workers: !ref <num_workers>

epoch_counter: !new:speechbrain.utils.epoch_loop.EpochCounter
    limit: !ref <number_of_epochs>

whisper: !new:adacs_whisper.AdaCS_Whisper
    source: "openai/whisper-small"
    save_path: "pretrained_models"
    use_lora: True
    lora_rank: !ref <lora_rank>
    lora_alpha: !ref <lora_alpha>
    num_biases: !ref <num_biases>
    language: "vi"

train_logger: !new:speechbrain.utils.train_logger.FileTrainLogger
    save_file: !ref <train_log>

# batch_size=8, grad_accum=4 → effective batch=32
lr_annealing: !new:speechbrain.nnet.schedulers.WarmAndExpDecayLRSchedule
    lr: 1.0
    n_warmup_steps: 100
    total_steps: 4600
    decay_factor: 0.1

error_rate_computer: !name:speechbrain.utils.metric_stats.ErrorRateStats

valid_search: !new:speechbrain.decoders.seq2seq.S2SWhisperBeamSearcher
    module: [!ref <whisper>]
    min_decode_ratio: !ref <min_decode_ratio>
    max_decode_ratio: !ref <max_decode_ratio>
    beam_size: !ref <valid_beam_size>

test_search: !new:speechbrain.decoders.seq2seq.S2SWhisperBeamSearcher
    module: [!ref <whisper>]
    min_decode_ratio: !ref <min_decode_ratio>
    max_decode_ratio: !ref <max_decode_ratio>
    beam_size: !ref <test_beam_size>

modules:
    whisper: !ref <whisper>

checkpointer: !new:speechbrain.utils.checkpoints.Checkpointer
    checkpoints_dir: !ref <save_folder>
    recoverables:
        whisper: !ref <whisper>
        epoch_counter: !ref <epoch_counter>
        lr_annealing: !ref <lr_annealing>

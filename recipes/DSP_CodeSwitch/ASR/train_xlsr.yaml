# Seed needs to be set at top of yaml, before objects with parameters are instantiated
seed: 2025
__set_seed: !apply:speechbrain.utils.seed_everything [!ref <seed>]

# Folder paths
data_folder: ../../../data/vimedcss
output_folder: !ref results/DSP_XLSR_CodeSwitch/<seed>
save_folder: !ref <output_folder>/save
train_log: !ref <output_folder>/train_log.txt

# JSON Annotations
train_annotation: !ref <data_folder>/train.json
valid_annotation: !ref <data_folder>/valid.json
test_annotation: !ref <data_folder>/test.json

# Curriculum Learning Flags
warmup_only: False       # STAGE 1: Freeze decoder, only train GRU for LID.
lid_loss_weight: 0.2    # Weight for LID loss during Joint Training (Stage 2)

# Training parameters
number_of_epochs: 15
batch_size: 1
lr: 0.0001
label_smoothing: 0.1
num_workers: 2

# SpecAugment (applied on features during training)
enable_spec_augment: True

# Dataloader options
train_dataloader_opts:
    batch_size: !ref <batch_size>
    num_workers: !ref <num_workers>
    shuffle: True

valid_dataloader_opts:
    batch_size: !ref <batch_size>
    num_workers: !ref <num_workers>

# Vocabulary and Decoders
output_neurons: 5000  # Tokenizer vocab size (BPE 5000)
blank_index: 0
bos_index: 1
eos_index: 2

# Epoch counter
epoch_counter: !new:speechbrain.utils.epoch_loop.EpochCounter
    limit: !ref <number_of_epochs>

# Beam Search decoders (used in valid/test)
valid_search: !new:speechbrain.decoders.S2SRNNBeamSearcher
    embedding: !ref <embedding>
    decoder: !ref <decoder>
    linear: !ref <seq_lin>
    bos_index: !ref <bos_index>
    eos_index: !ref <eos_index>
    min_decode_ratio: 0.0
    max_decode_ratio: 1.0
    beam_size: 16

test_search: !new:speechbrain.decoders.S2SRNNBeamSearcher
    embedding: !ref <embedding>
    decoder: !ref <decoder>
    linear: !ref <seq_lin>
    bos_index: !ref <bos_index>
    eos_index: !ref <eos_index>
    min_decode_ratio: 0.0
    max_decode_ratio: 1.0
    beam_size: 64

# Models
# DSP-CS on XLS-R 53 Large (315M + LoRA adapters)
dsp_model: !new:dsp_xlsr.DSP_XLSR
    source: "facebook/wav2vec2-large-xlsr-53"
    save_path: "pretrained_models"
    input_size: 1024
    hidden_size: 256
    num_languages: 3       # VI=1, EN=2, SIL=0
    lora_rank: 16
    lora_alpha: 1.0
    dropout: 0.1

# Embedding
embedding: !new:speechbrain.nnet.embedding.Embedding
    num_embeddings: !ref <output_neurons>
    embedding_dim: 256

# Decoder (Attention-based GRU)
decoder: !new:speechbrain.nnet.RNN.AttentionalRNNDecoder
    enc_dim: 1024
    input_size: 256
    rnn_type: gru
    attn_type: location
    hidden_size: 512
    attn_dim: 512
    num_layers: 1
    channels: 10
    kernel_size: 100

# Seq2Seq linear (512 → vocab)
seq_lin: !new:speechbrain.nnet.linear.Linear
    input_size: 512
    n_neurons: !ref <output_neurons>

# CTC linear (1024 → vocab, for ONNX export)
ctc_lin: !new:speechbrain.nnet.linear.Linear
    input_size: 1024
    n_neurons: !ref <output_neurons>

log_softmax: !new:speechbrain.nnet.activations.Softmax
    apply_log: True

# Tokenizer
tokenizer: !new:speechbrain.tokenizers.SentencePiece.SentencePiece
    model_dir: ../Tokenizer/save
    vocab_size: !ref <output_neurons>
    annotation_train: !ref <train_annotation>
    annotation_read: words
    model_type: bpe
    character_coverage: 1.0

# Optimizer
opt_class: !name:torch.optim.Adam
    lr: !ref <lr>

# Training Logger
train_logger: !new:speechbrain.utils.train_logger.FileTrainLogger
    save_file: !ref <train_log>

# LR Scheduler
lr_annealing: !new:speechbrain.nnet.schedulers.WarmAndExpDecayLRSchedule
    lr: 0.0001
    n_warmup_steps: 1500
    total_steps: 177330
    decay_factor: 0.1

# SpecAugment components
time_drop: !new:speechbrain.augment.freq_domain.SpectrogramDrop
    drop_length_low: 3
    drop_length_high: 10
    drop_count_low: 1
    drop_count_high: 3
    replace: "zeros"
    dim: 1

feat_drop: !new:speechbrain.augment.freq_domain.SpectrogramDrop
    drop_length_low: 5
    drop_length_high: 15
    drop_count_low: 1
    drop_count_high: 2
    replace: "zeros"
    dim: 2

spec_augment: !new:speechbrain.augment.augmenter.Augmenter
    augmentations: [!ref <time_drop>, !ref <feat_drop>]
    augment_prob: 0.8

error_rate_computer: !name:speechbrain.utils.metric_stats.ErrorRateStats

# Gathering Submodels
modules:
    dsp_model: !ref <dsp_model>
    embedding: !ref <embedding>
    decoder: !ref <decoder>
    seq_lin: !ref <seq_lin>
    ctc_lin: !ref <ctc_lin>
    spec_augment: !ref <spec_augment>

checkpointer: !new:speechbrain.utils.checkpoints.Checkpointer
    checkpoints_dir: !ref <save_folder>
    recoverables:
        dsp_model: !ref <dsp_model>
        decoder: !ref <decoder>
        embedding: !ref <embedding>
        seq_lin: !ref <seq_lin>
        ctc_lin: !ref <ctc_lin>
        lr_annealing: !ref <lr_annealing>
        epoch_counter: !ref <epoch_counter>

# EXP-D: Switch-Point Aware Loss (SPAL)
# =======================================
# Thay đổi DUY NHẤT: spal_boost = 2.0, spal_radius = 1
# → Tăng CE loss weight 2x cho tokens tại code-switching boundary
# → NOVELTY: không paper nào làm cái này!
#
# Chạy:
#   cd /workspace/DSP-CS-ASR/recipes/DSP_CodeSwitch/ASR
#   PYTHONPATH=../../.. python3 train_whisper.py exp_d_spal.yaml \
#       --data_folder /workspace/DSP-CS-ASR/data/vimedcss \
#       --output_folder ../../../results/DSP_Whisper_EXP_D_spal/2025 \
#       --save_folder ../../../results/DSP_Whisper_EXP_D_spal/2025/save \
#       --train_log ../../../results/DSP_Whisper_EXP_D_spal/2025/train_log.txt

seed: 2025
__set_seed: !apply:speechbrain.utils.seed_everything [!ref <seed>]

data_folder: ../../../data/vimedcss
output_folder: !ref ../../../results/DSP_Whisper_EXP_D_spal/<seed>
save_folder: !ref <output_folder>/save
train_log: !ref <output_folder>/train_log.txt

train_annotation: !ref <data_folder>/train.json
valid_annotation: !ref <data_folder>/valid.json
test_annotation: !ref <data_folder>/test.json

warmup_only: False
lid_loss_weight: 0.1
lid_loss_weight_start: 0.05
lid_loss_weight_end: 0.01
lid_loss_weight_decay_start_epoch: 1
lid_loss_weight_decay_end_epoch: 15
label_smoothing: 0.1
dynamic_lid_weights: True

# ===== EXP-D: SPAL =====
spal_boost: 2.0         # weight multiplier at switch points
spal_radius: 1           # boost ±1 token around switch boundary

number_of_epochs: 50
early_stop_patience: 5
batch_size: 8
lr_backbone: 0.0003
lr_decoder: 0.00015
weight_decay: 0.0001
num_workers: 16
min_decode_ratio: 0.0
max_decode_ratio: 1.0
valid_beam_size: 4
test_beam_size: 8

train_dataloader_opts:
    batch_size: !ref <batch_size>
    num_workers: !ref <num_workers>
    shuffle: True

valid_dataloader_opts:
    batch_size: !ref <batch_size>
    num_workers: !ref <num_workers>

blank_index: 0

epoch_counter: !new:speechbrain.utils.epoch_loop.EpochCounter
    limit: !ref <number_of_epochs>

dsp_model: !new:dsp_whisper.DSP_Whisper
    source: "openai/whisper-small"
    save_path: "pretrained_models"
    input_size: 768
    hidden_size: 256
    num_languages: 3
    adapter_size: 64
    lora_rank: 16
    lora_alpha: 32.0
    dropout: 0.1
    language: "vi"

train_logger: !new:speechbrain.utils.train_logger.FileTrainLogger
    save_file: !ref <train_log>

lr_annealing: !new:speechbrain.nnet.schedulers.WarmAndExpDecayLRSchedule
    lr: 1.0
    n_warmup_steps: 300
    total_steps: 18500
    decay_factor: 0.1

error_rate_computer: !name:speechbrain.utils.metric_stats.ErrorRateStats

valid_search: !new:speechbrain.decoders.seq2seq.S2SWhisperBeamSearcher
    module: [!ref <dsp_model>]
    min_decode_ratio: !ref <min_decode_ratio>
    max_decode_ratio: !ref <max_decode_ratio>
    beam_size: !ref <valid_beam_size>

test_search: !new:speechbrain.decoders.seq2seq.S2SWhisperBeamSearcher
    module: [!ref <dsp_model>]
    min_decode_ratio: !ref <min_decode_ratio>
    max_decode_ratio: !ref <max_decode_ratio>
    beam_size: !ref <test_beam_size>

modules:
    dsp_model: !ref <dsp_model>

checkpointer: !new:speechbrain.utils.checkpoints.Checkpointer
    checkpoints_dir: !ref <save_folder>
    recoverables:
        dsp_model: !ref <dsp_model>
        epoch_counter: !ref <epoch_counter>
        lr_annealing: !ref <lr_annealing>

# DSP-CS v2: Optimized Original Architecture
# ============================================
# Key changes vs v1:
#   1. lid_loss_weight: 0.2 → 0.05 (CTC gets 95% gradient, not 80%)
#   2. freeze_dsp_epochs: 3 → 0 (no wasted epochs, train from epoch 1)
#   3. number_of_epochs: 30 → 50 (more time to converge with PEFT)
#   4. warmup_steps: 500 → 1000 (Longer warmup = more stable gradient at start)
#   5. decay_factor: 0.1 → 0.05 (Slower decay, LR stays effective longer)
# Resource: SAME as v1 (~12M params, 3.8% of model)
# Target: WER < 30% (vs v1's 36.16%)

seed: 2025
__set_seed: !apply:speechbrain.utils.seed_everything [!ref <seed>]

# Folder paths
data_folder: ../../../data/vimedcss
output_folder: !ref results/DSP_XLSR_v2/<seed>
save_folder: !ref <output_folder>/save
train_log: !ref <output_folder>/train_log.txt

# JSON Annotations
train_annotation: !ref <data_folder>/train.json
valid_annotation: !ref <data_folder>/valid.json
test_annotation: !ref <data_folder>/test.json

# Curriculum Learning Flags
warmup_only: False
lid_loss_weight: 0.2     # Same as v1 — prove LID effectiveness
freeze_dsp_epochs: 0     # v2: No wasted epochs, full training from epoch 1

# Training parameters
number_of_epochs: 30     # Same as v1/baseline for fair comparison
batch_size: 1
lr_backbone: 0.0003      # Same as v1 (works well for LoRA)
lr_ctc: 0.005            # Same as v1/baseline
label_smoothing: 0.1
num_workers: 2

# SpecAugment
enable_spec_augment: True

# Dataloader options
train_dataloader_opts:
    batch_size: !ref <batch_size>
    num_workers: !ref <num_workers>
    shuffle: True

valid_dataloader_opts:
    batch_size: !ref <batch_size>
    num_workers: !ref <num_workers>

# Vocabulary
output_neurons: 5000
blank_index: 0

# Epoch counter
epoch_counter: !new:speechbrain.utils.epoch_loop.EpochCounter
    limit: !ref <number_of_epochs>

# Models - SAME architecture as v1 (DSP_XLSR with Top-6 LoRA)
dsp_model: !new:dsp_xlsr.DSP_XLSR
    source: "facebook/wav2vec2-large-xlsr-53"
    save_path: "pretrained_models"
    input_size: 1024
    hidden_size: 256
    num_languages: 3
    lora_rank: 64           # SAME as v1 — keep resource parity
    lora_alpha: 2.0
    dropout: 0.1

# CTC Linear Projection
ctc_lin: !new:speechbrain.nnet.linear.Linear
    input_size: 1024
    n_neurons: !ref <output_neurons>

log_softmax: !new:speechbrain.nnet.activations.Softmax
    apply_log: True

# Tokenizer
tokenizer: !new:speechbrain.tokenizers.SentencePiece.SentencePiece
    model_dir: ../Tokenizer/save
    vocab_size: !ref <output_neurons>
    annotation_train: !ref <train_annotation>
    annotation_read: words
    model_type: bpe
    character_coverage: 1.0
    annotation_format: json

# Training Logger
train_logger: !new:speechbrain.utils.train_logger.FileTrainLogger
    save_file: !ref <train_log>

# LR Scheduler: warmup + exponential decay
# batch_size=1 → ~11822 batches/epoch × 50 epochs = 591100 total steps
lr_annealing: !new:speechbrain.nnet.schedulers.WarmAndExpDecayLRSchedule
    lr: 1.0
    n_warmup_steps: 1000    # Longer warmup for stable gradient ramp-up
    total_steps: 354660     # 30 epochs × 11822 steps
    decay_factor: 0.05      # Slower decay: LR stays effective longer

# SpecAugment: same as baseline
time_drop: !new:speechbrain.augment.freq_domain.SpectrogramDrop
    drop_length_low: 3
    drop_length_high: 10
    drop_count_low: 1
    drop_count_high: 3
    replace: "zeros"
    dim: 1

feat_drop: !new:speechbrain.augment.freq_domain.SpectrogramDrop
    drop_length_low: 5
    drop_length_high: 15
    drop_count_low: 1
    drop_count_high: 2
    replace: "zeros"
    dim: 2

spec_augment: !new:speechbrain.augment.augmenter.Augmenter
    augmentations: [!ref <time_drop>, !ref <feat_drop>]
    augment_prob: 0.8

error_rate_computer: !name:speechbrain.utils.metric_stats.ErrorRateStats

# Gathering Submodels
modules:
    dsp_model: !ref <dsp_model>
    ctc_lin: !ref <ctc_lin>
    spec_augment: !ref <spec_augment>

checkpointer: !new:speechbrain.utils.checkpoints.Checkpointer
    checkpoints_dir: !ref <save_folder>
    recoverables:
        dsp_model: !ref <dsp_model>
        ctc_lin: !ref <ctc_lin>
        epoch_counter: !ref <epoch_counter>
        lr_annealing: !ref <lr_annealing>

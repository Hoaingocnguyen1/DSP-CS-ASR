# DSP-CS v3: Distributed LoRA + Stronger Regularization
# ======================================================
# Key changes vs v1:
#   1. LoRA rank 64 × 6 layers → rank 32 × 12 layers (same total params, better distributed)
#   2. Dropout 0.1 → 0.2 (stronger regularization)
#   3. Weight decay 1e-4 for LoRA params
#   4. freeze_dsp_epochs: 3 → 0 (train from epoch 1)
#   5. SpecAugment prob 0.8 → 1.0
#   6. Keeps Focal Loss for LID, learnable lang_emb_scale
# Resource: Same ~4.7M LoRA params as v1 (3.8% of model)

seed: 2025
__set_seed: !apply:speechbrain.utils.seed_everything [!ref <seed>]

# Folder paths
data_folder: ../../../data/vimedcss
output_folder: !ref results/DSP_XLSR_v3/<seed>
save_folder: !ref <output_folder>/save
train_log: !ref <output_folder>/train_log.txt

# JSON Annotations
train_annotation: !ref <data_folder>/train.json
valid_annotation: !ref <data_folder>/valid.json
test_annotation: !ref <data_folder>/test.json

# Curriculum Learning Flags
warmup_only: False
lid_loss_weight: 0.2     # Keep 0.2 to prove LID effectiveness
freeze_dsp_epochs: 0     # No freeze — train from epoch 1

# Training parameters
number_of_epochs: 30
batch_size: 1
lr_backbone: 0.0003      # Same as v1
lr_ctc: 0.005            # Same as v1/baseline
weight_decay: 0.0001     # v3: L2 regularization for LoRA params
label_smoothing: 0.1
num_workers: 2

# SpecAugment
enable_spec_augment: True

# Dataloader options
train_dataloader_opts:
    batch_size: !ref <batch_size>
    num_workers: !ref <num_workers>
    shuffle: True

valid_dataloader_opts:
    batch_size: !ref <batch_size>
    num_workers: !ref <num_workers>

# Vocabulary
output_neurons: 5000
blank_index: 0

# Epoch counter
epoch_counter: !new:speechbrain.utils.epoch_loop.EpochCounter
    limit: !ref <number_of_epochs>

# Models — v3: rank 32, dropout 0.2 (distributed LoRA)
dsp_model: !new:dsp_xlsr.DSP_XLSR
    source: "facebook/wav2vec2-large-xlsr-53"
    save_path: "pretrained_models"
    input_size: 1024
    hidden_size: 256
    num_languages: 3
    lora_rank: 32           # v3: lower rank (was 64 in v1)
    lora_alpha: 2.0
    dropout: 0.2            # v3: higher dropout (was 0.1)

# CTC Linear Projection
ctc_lin: !new:speechbrain.nnet.linear.Linear
    input_size: 1024
    n_neurons: !ref <output_neurons>

log_softmax: !new:speechbrain.nnet.activations.Softmax
    apply_log: True

# Tokenizer
tokenizer: !new:speechbrain.tokenizers.SentencePiece.SentencePiece
    model_dir: ../Tokenizer/save
    vocab_size: !ref <output_neurons>
    annotation_train: !ref <train_annotation>
    annotation_read: words
    model_type: bpe
    character_coverage: 1.0
    annotation_format: json

# Training Logger
train_logger: !new:speechbrain.utils.train_logger.FileTrainLogger
    save_file: !ref <train_log>

# LR Scheduler
# batch_size=1 → ~11822 batches/epoch × 30 epochs = 354660 total steps
lr_annealing: !new:speechbrain.nnet.schedulers.WarmAndExpDecayLRSchedule
    lr: 1.0
    n_warmup_steps: 500
    total_steps: 354660
    decay_factor: 0.1

# SpecAugment: v3 stronger (augment_prob 1.0)
time_drop: !new:speechbrain.augment.freq_domain.SpectrogramDrop
    drop_length_low: 3
    drop_length_high: 10
    drop_count_low: 1
    drop_count_high: 3
    replace: "zeros"
    dim: 1

feat_drop: !new:speechbrain.augment.freq_domain.SpectrogramDrop
    drop_length_low: 5
    drop_length_high: 15
    drop_count_low: 1
    drop_count_high: 2
    replace: "zeros"
    dim: 2

spec_augment: !new:speechbrain.augment.augmenter.Augmenter
    augmentations: [!ref <time_drop>, !ref <feat_drop>]
    augment_prob: 1.0       # v3: always augment (was 0.8)

error_rate_computer: !name:speechbrain.utils.metric_stats.ErrorRateStats

# Gathering Submodels
modules:
    dsp_model: !ref <dsp_model>
    ctc_lin: !ref <ctc_lin>
    spec_augment: !ref <spec_augment>

checkpointer: !new:speechbrain.utils.checkpoints.Checkpointer
    checkpoints_dir: !ref <save_folder>
    recoverables:
        dsp_model: !ref <dsp_model>
        ctc_lin: !ref <ctc_lin>
        epoch_counter: !ref <epoch_counter>
        lr_annealing: !ref <lr_annealing>
